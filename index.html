<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股研究網站｜P0 功能原型</title>
<style>
:root{
  --navy:#1f2d5a; --navy2:#2d3f7a; --bg:#f4f6fb; --card:#fff; --line:#e3e7f0;
  --text:#1c2333; --sub:#6b7489; --up:#d6303a; --down:#169c5b; --accent:#3b6cf6;
  --ai:#7b4dff; --warn:#ff9f1a; --chip:#eef1f8;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--sub)}
/* header */
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:50}
.hbar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px;padding:10px 20px}
.logo{font-weight:800;font-size:17px;letter-spacing:.5px;white-space:nowrap;cursor:pointer}
.logo small{font-weight:400;opacity:.65;font-size:11px;margin-left:6px}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:#cfd6ee;padding:7px 12px;border-radius:8px;font-size:14px}
nav button.on,nav button:hover{background:var(--navy2);color:#fff}
.search{position:relative;flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;border:0;border-radius:10px;padding:9px 12px 9px 34px;font-size:14px;background:#fff}
.search:before{content:"⌕";position:absolute;left:12px;top:6px;color:#8892a8;font-size:18px}
.sug{position:absolute;top:42px;left:0;right:0;background:#fff;color:var(--text);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;display:none}
.sug div{padding:9px 14px;display:flex;justify-content:space-between;cursor:pointer}
.sug div:hover,.sug div.act{background:var(--chip)}
.mstat{font-size:12px;opacity:.85;white-space:nowrap}
.idtoggle{font-size:12px;opacity:.85;display:flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
main{max-width:1180px;margin:auto;padding:18px 20px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:400;font-size:12px}
.pid{display:inline-block;font-size:10px;font-weight:700;color:#b4232c;background:#fde7e9;border-radius:5px;padding:1px 5px;vertical-align:middle;letter-spacing:.3px}
body.noid .pid{display:none}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--chip);color:var(--sub)}
.tag.hold{background:#fff1d6;color:#9a6200}
.tag.ai{background:#efe9ff;color:var(--ai)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font-size:13px;color:var(--text)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{border:0;border-radius:9px;padding:8px 14px;font-size:13.5px;background:var(--chip);color:var(--text)}
.btn.pri{background:var(--accent);color:#fff}
.btn.ghost{background:none;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 330px;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}.mstat,.idtoggle{display:none}nav button{padding:6px 8px}}
/* event bar */
.evbar{background:linear-gradient(90deg,#fff4e0,#fff);border:1px solid #ffd99a;border-radius:14px;margin-bottom:14px;overflow:hidden}
.evhead{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer}
.evhead .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px #ffe6bd}
.evitems{border-top:1px solid #ffe2b0;padding:4px 16px 12px;display:none}
.evbar.open .evitems{display:block}
.evrow{padding:10px 0;border-bottom:1px dashed #f2dcb4}
.evrow:last-child{border:0}
/* holdings */
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--sub);font-weight:500;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer} tbody tr:hover{background:#f8f9fd}
.tk{font-weight:700}.nm{font-size:12px;color:var(--sub)}
.since{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.since .box{background:var(--bg);border-radius:10px;padding:10px 12px}
.since .big{font-size:20px;font-weight:700}
.sector{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.sector .s{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.heat{height:6px;border-radius:4px;background:var(--chip);margin:6px 0;overflow:hidden}
.heat i{display:block;height:100%}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding:28px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:28px;margin:0 0 8px;line-height:1.3}
.vp{display:flex;gap:12px;margin:16px 0}
.vp div{flex:1;background:var(--bg);border-radius:12px;padding:12px}
.vp b{display:block;font-size:15px;margin-bottom:2px}
.preview{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafbff;transform:rotate(-1deg);box-shadow:0 12px 30px rgba(31,45,90,.12)}
/* stock page */
.qhead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.qhead .px{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.qact{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ratingbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:8px 0}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.kv div{background:var(--bg);border-radius:9px;padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--sub)}
.kv b{font-size:16px;font-variant-numeric:tabular-nums}
@media(max-width:600px){.kv{grid-template-columns:repeat(2,1fr)}}
.aicard{border:1px solid #ddd2ff;background:linear-gradient(180deg,#faf8ff,#fff)}
.aistep{display:flex;gap:10px;padding:8px 0}
.aistep .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ai);color:#fff;font-size:12px;display:grid;place-items:center;margin-top:1px}
.src{font-size:11.5px;color:var(--sub);margin-top:2px}
.src a{margin-left:6px}
.orig{display:none;background:#f4f1ff;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#4a3f6b;margin-top:6px;font-style:italic}
.term{border-bottom:1px dashed var(--accent);color:inherit;cursor:help}
.pop{position:absolute;z-index:80;background:#1c2333;color:#fff;border-radius:10px;padding:10px 12px;width:260px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
.pop b{font-size:13.5px}
.news li{list-style:none;padding:10px 0 10px 18px;border-left:2px solid var(--line);position:relative;margin-left:4px}
.news li:before{content:"";position:absolute;left:-6px;top:15px;width:10px;height:10px;border-radius:50%;background:#c6cce0}
.news li.major:before{background:var(--up)}
.news ul{padding:0;margin:0}
.chart svg{width:100%;display:block}
.view-pt{padding:6px 0;border-bottom:1px dashed var(--line)}
.view-pt:last-child{border:0}
/* modal */
.mask{position:fixed;inset:0;background:rgba(20,26,45,.45);display:none;place-items:center;z-index:100}
.mask.on{display:grid}
.modal{background:#fff;border-radius:16px;padding:20px 22px;width:min(420px,92vw)}
.modal h4{margin:0 0 4px;font-size:17px}
.modal input[type=number],.modal input[type=text]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:15px;margin:6px 0}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px;font-size:13px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1c2333;color:#fff;padding:10px 18px;border-radius:10px;transition:.25s;z-index:120;opacity:0}
.toast.on{transform:translateX(-50%);opacity:1}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#c9cfdd;border-radius:22px;transition:.2s}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(18px)}
.rule{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border:0}
.foot{font-size:12px;color:var(--sub);text-align:center;margin-top:24px}
.empty{color:var(--sub);text-align:center;padding:18px}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="logo" onclick="go('home')">美股研究網站<small>P0 原型</small></div>
    <nav>
      <button data-v="home" onclick="go('home')">我的持股</button>
      <button data-v="stock" onclick="go('stock',state.cur||'NVDA')">個股頁</button>
      <button data-v="alerts" onclick="go('alerts')">通知與提醒</button>
    </nav>
    <div class="search">
      <input id="q" placeholder="搜尋：輝達、NVIDIA、NVDA" autocomplete="off">
      <div class="sug" id="sug"></div>
    </div>
    <label class="idtoggle"><input type="checkbox" id="idt" checked> 顯示功能編號</label>
    <div class="mstat" id="mstat"></div>
  </div>
</header>
<main id="app"></main>
<div class="pop" id="pop"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 示意資料（非即時報價） ============ */

const SECTORS=[

 {n:'電動車',pct:-3.9,heat:71,reps:['TSLA'],why:'交車數據不如預期，市場擔心價格戰延續。'},

];
const GLOSS={

 DC:['資料中心','Data Center','放置大量伺服器的機房，AI 模型訓練與運算主要在這裡進行，是輝達最大營收來源。']
};
const T=(k,label)=>`<span class="term" data-g="${k}">${label||GLOSS[k][0]}</span>`;

const DETAIL={
 NVDA:{
  rating:{buy:52,hold:6,sell:1},tp:{avg:215,high:260,low:150},upd:'2026/11/20',src:'FactSet 分析師共識（示意）',
  changes:[['摩根士丹利','維持 '+T('OW','加碼')+'，目標價 220 → 235','11/20'],['Bernstein','上調目標價 200 → 225','11/20']],
  bull:84,points:[['多','資料中心需求仍供不應求，下一代晶片訂單能見度到明年下半年。','Morgan Stanley · Joseph M.'],['多','毛利率維持七成以上，定價能力穩固。','Bernstein · Stacy R.'],['空','估值已反映樂觀預期，若雲端業者削減資本支出，股價波動恐放大。','Seaport · Jay G.']],
  ai:['輝達 11/19 公布第三季財報，營收與 '+T('EPS')+' 雙雙優於市場預期。','主因是 '+T('DC','資料中心')+'（AI 伺服器）需求持續強勁，公司同時上調下一季 '+T('GUIDE','營收指引')+'。','__IMPACT__'],
  aisrc:[['Reuters','11/20 05:12','Nvidia forecast fourth-quarter revenue above estimates, as demand for its AI chips stays strong.'],['NVIDIA 財報新聞稿','11/20 05:20','Record quarterly revenue, up from a year ago, driven by Data Center.'],['本站計算','即時','依你的持股與成本計算']],
  earn:{q:'FY27 Q3（2026/11/19 公布）',rev:['優於預期','+6%'],eps:['優於預期','+8%'],guide:'上調',pts:['營收再創新高，其中九成來自資料中心。',T('GM','毛利率')+'約 74%，與上季持平，代表沒有為了出貨而降價。','公司預估下一季營收持續成長，高於分析師原本的預期。']},

function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))%9973;return h}
function detail(t){
 const b=BASE[t],h=hash(t);
 if(DETAIL[t])return DETAIL[t];
 const avg=+(b.price*(1.04+(h%14)/100)).toFixed(0);

  rating:{buy:12+h%25,hold:5+h%9,sell:h%4},tp:{avg,high:+(avg*1.22).toFixed(0),low:+(b.price*0.82).toFixed(0)},upd:'2026/11/20',src:'FactSet 分析師共識（示意）',

 };
}

/* ============ 狀態 ============ */
const SAMPLE={
 list:['NVDA','TSM','AAPL','TSLA','MSFT','GOOGL'],

/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const f2=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=n=>(n>0?'+':'')+n.toFixed(2);
const cls=n=>n>0?'up':n<0?'down':'';
const pid=s=>`<span class="pid">${s}</span>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function market(){
 const ny=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
 const d=ny.getDay(),m=ny.getHours()*60+ny.getMinutes();
 let s='休市';if(d>0&&d<6){if(m>=240&&m<570)s='盤前';else if(m>=570&&m<960)s='盤中';else if(m>=960&&m<1200)s='盤後';}
 const tw=new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
 return {s,tw};
}
function thr(){return {'高':3,'中':5,'低':8}[state.rules.sens]}
function events(){
 const ev=[];if(!state.rules.on)return ev;
 Object.keys(state.hold).forEach(t=>{const b=BASE[t];
  if(state.rules.earn&&t==='NVDA')ev.push({t,type:'財報公布',txt:'財報優於預期，上調下季財測'});
  else if(state.rules.move&&Math.abs(b.pct)>=thr())ev.push({t,type:'劇烈波動',txt:`今日${b.pct>0?'大漲':'大跌'} ${Math.abs(b.pct).toFixed(1)}%`});
 });
 return ev;
}
function impact(t){
 const b=BASE[t],h=state.hold[t],d=detail(t),gap=(d.tp.avg/b.price-1)*100;
 if(!h)return `你目前沒有持有${b.zh}。股價距分析師平均目標價 ${sg(gap)}%，可先加入觀察。`;
 if(h.cost){const pl=(b.price-h.cost)*h.shares,plp=(b.price/h.cost-1)*100;
  return `你持有 ${h.shares} 股，今日損益約 <b class="${cls(b.pct)}">${sg(b.price*b.pct/(100+b.pct)*h.shares)} 美元</b>；整體仍${pl>=0?'獲利':'虧損'} ${plp.toFixed(1)}%，距平均目標價 ${sg(gap)}%。`}
 return `你持有 ${h.shares} 股，今日${b.pct>=0?'上漲':'下跌'} ${Math.abs(b.pct).toFixed(2)}%。填入買入成本即可看到損益。`;
}

/* ============ Router ============ */
function go(v,t){state.view=v;if(t)state.cur=t;render();window.scrollTo(0,0)}
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view));
 const m=market();$('#mstat').textContent=`美股 ${m.s}｜台灣 ${m.tw}`;
 $('#app').innerHTML=state.view==='home'?home():state.view==='stock'?stock(state.cur||'NVDA'):alerts();
 if(state.view==='stock')drawChart();
}

 </div></div>
 <div class="foot">示意資料，非即時報價，亦非投資建議・紅漲綠跌（台灣慣例）</div>`;
}

/* ============ 走勢圖 ============ */
function series(t){
 const n={'1日':78,'5日':100,'1月':22,'6月':126,'1年':252,'5年':260}[state.range],tot=n+120;
 let seed=hash(t+state.range),p=BASE[t].price;const out=[p];
 const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
 const vol={'1日':.002,'5日':.003}[state.range]||.018;
 for(let i=1;i<tot;i++){p=p/(1+(rnd()-.47)*vol*2);out.unshift(p)}
 return {all:out,n};
}
function sma(a,k){return a.map((_,i)=>i<k-1?null:a.slice(i-k+1,i+1).reduce((x,y)=>x+y,0)/k)}
function ema(a,k){const m=2/(k+1);let e=a[0];return a.map(v=>e=v*m+e*(1-m))}
function rsi(a,k=14){const r=[null];let g=0,l=0;for(let i=1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(k-1)+Math.max(d,0))/k;l=(l*(k-1)+Math.max(-d,0))/k;r.push(l===0?100:100-100/(1+g/l))}return r}
function drawChart(){
 const t=state.cur||'NVDA',{all,n}=series(t),off=all.length-n,c=all.slice(off);
 const W=800,H=240,P=8;
 const ma20=sma(all,20).slice(off),ma100=sma(all,100).slice(off);
 let vals=[...c];if(state.ind.MA)vals=vals.concat(ma20.filter(v=>v),ma100.filter(v=>v));
 const mn=Math.min(...vals),mx=Math.max(...vals);
 const x=i=>P+i*(W-2*P)/(n-1),y=v=>P+(mx-v)*(H-2*P-14)/(mx-mn||1);
 const path=a=>a.map((v,i)=>v==null?'':`${a.slice(0,i).some(z=>z!=null)?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
 const upc=c[n-1]>=c[0]?'#d6303a':'#169c5b';
 let s=`<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${upc}" stop-opacity=".18"/><stop offset="1" stop-color="${upc}" stop-opacity="0"/></linearGradient></defs>
 ${[0,1,2,3].map(i=>`<line x1="0" x2="${W}" y1="${P+i*(H-2*P-14)/3}" y2="${P+i*(H-2*P-14)/3}" stroke="#eef0f6"/>`).join('')}
 <path d="${path(c)} L${x(n-1)},${H-14} L${x(0)},${H-14}Z" fill="url(#g)"/>
 <path d="${path(c)}" fill="none" stroke="${upc}" stroke-width="2"/>
 ${state.ind.MA?`<path d="${path(ma20)}" fill="none" stroke="#ff9f1a" stroke-width="1.5"/><path d="${path(ma100)}" fill="none" stroke="#3b6cf6" stroke-width="1.5"/>
 <text x="10" y="${H-2}" font-size="11" fill="#ff9f1a">— MA20 ${f2(ma20[n-1])}</text><text x="130" y="${H-2}" font-size="11" fill="#3b6cf6">— MA100 ${f2(ma100[n-1])}</text>`:''}
 <text x="${W-6}" y="16" font-size="11" fill="#6b7489" text-anchor="end">${f2(mx)}</text><text x="${W-6}" y="${H-18}" font-size="11" fill="#6b7489" text-anchor="end">${f2(mn)}</text>
 </svg>`;
 if(state.ind.RSI){const r=rsi(all).slice(off),h=70,yy=v=>4+(100-v)*(h-8)/100;
  s+=`<svg viewBox="0 0 ${W} ${h}" style="border-top:1px solid #eef0f6"><rect x="0" y="${yy(70)}" width="${W}" height="${yy(30)-yy(70)}" fill="#f4f6fb"/>
  <path d="${r.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${yy(v).toFixed(1)}`).join('')}" fill="none" stroke="#7b4dff" stroke-width="1.5"/>
  <text x="10" y="14" font-size="11" fill="#7b4dff">RSI(14) ${r[n-1].toFixed(1)}　<tspan fill="#6b7489">70 以上偏熱、30 以下偏冷</tspan></text></svg>`}
 if(state.ind.MACD){const dif=ema(all,12).map((v,i)=>v-ema(all,26)[i]),sig=ema(dif,9),hist=dif.map((v,i)=>v-sig[i]);
  const hh=hist.slice(off),dd=dif.slice(off),ss=sig.slice(off),m=Math.max(...hh.map(Math.abs),...dd.map(Math.abs))||1,h=70,yy=v=>h/2-v*(h/2-6)/m,bw=(W-2*P)/n*.7;
  s+=`<svg viewBox="0 0 ${W} ${h}" style="border-top:1px solid #eef0f6">${hh.map((v,i)=>`<rect x="${x(i)-bw/2}" y="${Math.min(yy(v),h/2)}" width="${bw}" height="${Math.abs(yy(v)-h/2)}" fill="${v>=0?'#f3a7ab':'#9fdcbc'}"/>`).join('')}
  <path d="${dd.map((v,i)=>`${i?'L':'M'}${x(i)},${yy(v)}`).join('')}" fill="none" stroke="#1f2d5a" stroke-width="1.3"/><path d="${ss.map((v,i)=>`${i?'L':'M'}${x(i)},${yy(v)}`).join('')}" fill="none" stroke="#ff9f1a" stroke-width="1.3"/>
  <text x="10" y="14" font-size="11" fill="#1f2d5a">MACD(12,26,9)</text></svg>`}
 $('#chart').innerHTML=s;
}

/* ============ 動作 / Modal ============ */
function modal(html){$('#modal').innerHTML=html;$('#mask').classList.add('on')}
function closeM(){$('#mask').classList.remove('on')}
$('#mask').addEventListener('click',e=>{if(e.target.id==='mask')closeM()});
function addWatch(t){if(!state.list.includes(t))state.list.push(t);state.onboarded=true;save();render();toast(`已加入自選（觀察中）：${BASE[t].zh}`)}
function openHold(t){const h=state.hold[t]||{};
 modal(`<h4>標記為持有中・${BASE[t].zh}</h4><div class="muted" style="font-size:12.5px">${pid('M2-B1-C2')} 成本可不填，填了才會顯示損益</div>
 <label>股數<input type="number" id="hs" value="${h.shares||''}" placeholder="例如 10"></label>
 <label>平均成本（選填，美元）<input type="number" id="hc" value="${h.cost||''}" placeholder="不填也可以"></label>
 <div class="mfoot">${state.hold[t]?`<button class="btn ghost" onclick="unhold('${t}')">改回觀察中</button>`:''}<button class="btn ghost" onclick="closeM()">取消</button><button class="btn pri" onclick="saveHold('${t}')">儲存</button></div>`)}
function unhold(t){delete state.hold[t];save();closeM();render();toast('已改回觀察中')}
function saveHold(t){const s=+$('#hs').value;if(!s){toast('請填股數');return}const c=+$('#hc').value||null;const isNew=!state.hold[t];
 state.hold[t]=Object.assign(state.hold[t]||{reason:[],note:''},{shares:s,cost:c});save();closeM();render();
 if(isNew&&state.reasonPrompt)setTimeout(()=>openReason(t),200);else toast('已更新持股');}
const REASONS=['基本面看好','跟隨專家','技術面訊號','分散資產','長期存股','題材熱度'];
function openReason(t){const h=state.hold[t];const sel=new Set(h.reason||[]);
 modal(`<h4>為什麼買 ${BASE[t].zh}？</h4><div class="muted" style="font-size:12.5px">${pid('M7-B2-C1 買入理由快選')} 10 秒完成，日後股價大波動時會提醒你當初的想法</div>
 <div class="chips" style="margin:12px 0" id="rs">${REASONS.map(r=>`<button class="chip ${sel.has(r)?'on':''}" onclick="this.classList.toggle('on')">${r}</button>`).join('')}</div>
 <input type="text" id="rn" placeholder="（選填）一句話記下想法" value="${h.note||''}">
 <label style="font-size:12.5px" class="muted"><input type="checkbox" id="rnever"> 以後不要再問我（可在設定重新開啟）</label>
 <div class="mfoot"><button class="btn ghost" onclick="skipReason()">略過</button><button class="btn pri" onclick="saveReason('${t}')">完成</button></div>`)}
function skipReason(){if($('#rnever').checked){state.reasonPrompt=false;save()}closeM();toast('已略過')}
function saveReason(t){state.hold[t].reason=[...document.querySelectorAll('#rs .chip.on')].map(b=>b.textContent);state.hold[t].note=$('#rn').value.trim();
 if($('#rnever').checked)state.reasonPrompt=false;save();closeM();render();toast('已記錄買入理由')}
let alertDir='up';
function openAlert(t){const p=BASE[t].price;alertDir='up';
 modal(`<h4>🔔 到價提醒・${BASE[t].zh}</h4><div class="muted" style="font-size:12.5px">${pid('M6-B2-C1 一步設定到價')} 現價 ${f2(p)}，輸入目標價即完成</div>
 <input type="number" id="ap" value="${p.toFixed(2)}" step="0.01" oninput="autoDir(${p})">
 <div class="seg" id="ad"><button class="on" onclick="setDir('up')">▲ 漲到（高於）</button><button onclick="setDir('down')">▼ 跌到（低於）</button></div>
 <div class="muted" id="ahint" style="font-size:12.5px;margin-top:8px"></div>
 <div class="mfoot"><button class="btn ghost" onclick="closeM()">取消</button><button class="btn pri" onclick="saveAlert('${t}')">完成</button></div>`);autoDir(p)}
function setDir(d){alertDir=d;document.querySelectorAll('#ad button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(d==='up')));hint()}
function autoDir(p){const v=+$('#ap').value;if(v)setDir(v>=p?'up':'down')}
function hint(){const t=state.cur,v=+$('#ap').value,p=BASE[t]?BASE[t].price:0;if(v&&p)$('#ahint').textContent=`距現價 ${sg((v/p-1)*100)}%・將以網頁推播通知`}
function saveAlert(t){const v=+$('#ap').value;if(!v)return;state.alerts.push({t,p:v,dir:alertDir});if(!state.list.includes(t))state.list.push(t);state.onboarded=true;save();closeM();render();toast(`已設定：${t} ${alertDir==='up'?'高於':'低於'} ${f2(v)} 通知`)}

/* ============ 通知與提醒頁 ============ */
function alerts(){const r=state.rules;
 const tg=(k,label,desc)=>`<div class="rule"><div style="flex:1"><b>${label}</b><div class="muted" style="font-size:12.5px">${desc}</div></div><label class="switch"><input type="checkbox" ${r[k]?'checked':''} onchange="state.rules.${k}=this.checked;save();render()"><span></span></label></div>`;
 return `<div class="grid2"><div>
 <div class="card"><h3>重大異動通知 ${pid('M6-B1-C1 異動觸發規則')}<span class="r muted">預設開啟・免設定</span></h3>
  ${tg('on','啟用重大異動通知','只針對你的自選與持股，平常不打擾')}
  <div style="opacity:${r.on?1:.4};pointer-events:${r.on?'auto':'none'}">
  ${tg('move','單日劇烈漲跌',`單日漲跌幅超過 ${thr()}% 時通知`)}
  ${tg('earn','財報公布','持股公布財報時，附 AI 白話重點')}
  ${tg('news','重大新聞','併購、高層異動、監管等重大事件')}
  <div class="rule"><div style="flex:1"><b>敏感度</b><div class="muted" style="font-size:12.5px">高＝漲跌 3%・中＝5%・低＝8%（建議以「劇烈波動」為準）</div></div>
   <div class="seg" style="width:180px">${['高','中','低'].map(s=>`<button class="${r.sens===s?'on':''}" onclick="state.rules.sens='${s}';save();render()">${s}</button>`).join('')}</div></div>
  </div>
 </div>
 <div class="card"><h3>我的到價提醒 <span class="r muted">在個股頁一步設定</span></h3>
  ${state.alerts.length?state.alerts.map((a,i)=>`<div class="rule"><div style="flex:1"><b>${a.t}</b> ${BASE[a.t].zh}<div class="muted" style="font-size:12.5px">${a.dir==='up'?'▲ 高於':'▼ 低於'} ${f2(a.p)}・現價 ${f2(BASE[a.t].price)}</div></div><button class="btn ghost" onclick="state.alerts.splice(${i},1);save();render()">刪除</button></div>`).join(''):'<div class="empty">還沒有到價提醒。到個股頁按「🔔 設到價提醒」即可。</div>'}
 </div></div>
 <div><div class="card"><h3>通知長這樣</h3>
  <div style="background:#1c2333;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px">
   <div style="opacity:.6;font-size:11.5px">美股研究網站・剛剛</div>
   <b>TSLA 特斯拉 −5.8%｜交車數據低於預期</b><div style="opacity:.85">點開看 AI 三句話重點 →</div></div>
  <div class="muted" style="font-size:12.5px;margin-top:8px">點擊通知直達該股 AI 重點小卡，而非首頁。目前觸發門檻：${thr()}%</div>
 </div></div></div>
 <div class="foot">示意資料，非即時報價</div>`;
}

/* ============ 搜尋 M8-B1-C1 ============ */
let sugIdx=-1;
$('#q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();const box=$('#sug');
 if(!v){box.style.display='none';return}
 const m=Object.entries(BASE).filter(([t,b])=>t.toLowerCase().includes(v)||b.zh.toLowerCase().includes(v)||b.en.toLowerCase().includes(v)).slice(0,6);
 sugIdx=-1;
 box.innerHTML=m.length?m.map(([t,b])=>`<div data-t="${t}"><span><b>${t}</b> ${b.zh} <span class="muted">${b.en}</span></span><span class="${cls(b.pct)}">${sg(b.pct)}%</span></div>`).join(''):'<div class="muted">找不到，試試中文名、英文名或代號</div>';
 box.style.display='block';});
$('#q').addEventListener('keydown',e=>{const items=[...document.querySelectorAll('#sug div[data-t]')];if(!items.length)return;
 if(e.key==='ArrowDown'){sugIdx=Math.min(sugIdx+1,items.length-1)}else if(e.key==='ArrowUp'){sugIdx=Math.max(sugIdx-1,0)}else if(e.key==='Enter'){pick((items[sugIdx]||items[0]).dataset.t);return}else return;
 e.preventDefault();items.forEach((d,i)=>d.classList.toggle('act',i===sugIdx))});
$('#sug').addEventListener('mousedown',e=>{const d=e.target.closest('div[data-t]');if(d)pick(d.dataset.t)});
$('#q').addEventListener('blur',()=>setTimeout(()=>$('#sug').style.display='none',150));
function pick(t){$('#q').value='';$('#sug').style.display='none';go('stock',t)}

/* ============ 名詞解釋 M3-B2-C1 ============ */
document.addEventListener('click',e=>{const el=e.target.closest('.term'),pop=$('#pop');
 if(!el){pop.style.display='none';return}
 const g=GLOSS[el.dataset.g],r=el.getBoundingClientRect();
 pop.innerHTML=`<b>${g[0]}</b> <span style="opacity:.6">${g[1]}</span><div style="margin-top:4px">${g[2]}</div>`;
 pop.style.display='block';pop.style.left=Math.min(r.left+window.scrollX,window.innerWidth-280)+'px';pop.style.top=(r.bottom+window.scrollY+6)+'px';});
$('#idt').addEventListener('change',e=>document.body.classList.toggle('noid',!e.target.checked));
setInterval(()=>{const m=market();$('#mstat').textContent=`美股 ${m.s}｜台灣 ${m.tw}`},30000);
render();
</script>
