<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股研究室 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   美股研究室 Prototype（第一版）
   版面概念：左側深藍選單 ＋ 右側白色卡片工作區；總覽在上、個股細節在下
   ---------------------------------------------------------
   給組員：這個檔案分三段
   1. <style>   外觀（顏色、字型、排版）
   2. <body>    頁面骨架
   3. <script>  假資料 ＋ 互動（點擊、切換頁面）
   ========================================================= */
:root{
  --ink:#16202e;          /* 主要文字 */
  --muted:#5f6b7c;        /* 次要文字 */
  --line:#e3e7ee;         /* 分隔線 */
  --paper:#f4f6fa;        /* 頁面底色 */
  --card:#ffffff;         /* 卡片底色 */
  --nav:#101b33;          /* 側邊選單 */
  --accent:#1f5fd6;       /* 主色：按鈕、連結 */
  --accent-soft:#e8effc;
  --up:#14895a;           /* 美股慣例：漲＝綠 */
  --up-soft:#e3f4ec;
  --down:#d23a3a;         /* 跌＝紅 */
  --down-soft:#fbe7e7;
  --warn:#b7700b;
  --warn-soft:#fdf1dc;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-num:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e7ecf4;--muted:#9aa6b8;--line:#263247;--paper:#0d1424;--card:#141e31;--nav:#0a1020;
    --accent:#6b9cff;--accent-soft:#1b2a4a;--up:#3ccb8b;--up-soft:#123326;--down:#ff6b6b;--down-soft:#3a1a1d;
    --warn:#f0b04a;--warn-soft:#3a2a10;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ecf4;--muted:#9aa6b8;--line:#263247;--paper:#0d1424;--card:#141e31;--nav:#0a1020;
  --accent:#6b9cff;--accent-soft:#1b2a4a;--up:#3ccb8b;--up-soft:#123326;--down:#ff6b6b;--down-soft:#3a1a1d;
  --warn:#f0b04a;--warn-soft:#3a2a10;color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* ---------- 整體版面 ---------- */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--nav);color:#c9d3e6;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--font-num)}
.brand small{display:block;color:#8d9ab3;font-size:11px}
.side h6{margin:14px 8px 4px;font-size:11px;color:#7d8aa5;font-weight:500;letter-spacing:.06em}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:#c9d3e6}
.nav-btn:hover{background:#1b2846}
.nav-btn.on{background:#22335a;color:#fff}
.nav-btn .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.side-foot{margin-top:auto;font-size:11px;color:#7d8aa5;padding:8px}

main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:22px;margin:0;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.disclaimer{margin-left:auto;font-size:12px;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{margin:0 0 4px;font-size:15px}
.sub{color:var(--muted);font-size:12px}
.more{margin-top:12px;background:none;border:0;padding:0;color:var(--accent);font-weight:500;font-size:13px}
.more:hover{text-decoration:underline}

/* ---------- 總覽：研究員卡片 ---------- */
.agents{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.agent{border-top:3px solid var(--c);display:flex;flex-direction:column}
.agent-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700}
.online{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-left:6px;vertical-align:middle}
.bubble{background:var(--paper);border-radius:10px;padding:11px 12px;font-size:13px}
.events{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px;font-size:13px}
.events li{display:flex;gap:8px;align-items:center}
.tag{font-size:11px;border-radius:5px;padding:1px 7px;white-space:nowrap}
.tag.hi{background:var(--down-soft);color:var(--down)}
.tag.mid{background:var(--warn-soft);color:var(--warn)}
.tag.lo{background:var(--accent-soft);color:var(--accent)}
.flows{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.flow{background:var(--up-soft);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px}
.flow b{display:block;color:var(--up);font-family:var(--font-num)}
.mood{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mood div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.mood b{display:block;font-size:18px;color:var(--ink)}
.mood .bull b{color:var(--up)}
.picks{display:grid;gap:6px;margin-top:12px}
.pick{display:flex;justify-content:space-between;align-items:center;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.pick:hover{border-color:var(--accent)}

/* ---------- 總覽：產業卡片 ---------- */
.section-title{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}
.section-title h2{font-size:16px;margin:0}
.sectors{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.sector{flex:0 0 150px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sector:hover{border-color:var(--accent)}
.sector.on{border:2px solid var(--accent);background:var(--accent-soft);padding:9px 11px}
.sector b{display:block;font-size:13px}
.sector .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}

/* ---------- 總覽：表格 ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--paper);border-radius:9px;padding:3px}
.tabs button{border:0;background:none;border-radius:7px;padding:5px 12px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;min-width:220px;font:inherit}
.count{color:var(--muted);font-size:13px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
th button{background:none;border:0;padding:0;color:inherit;font-size:12px}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--paper)}
.sym b{display:block;font-family:var(--font-num);font-size:15px}
.sym span{font-size:12px;color:var(--muted)}
.star{background:none;border:0;font-size:17px;color:var(--line);padding:2px 4px}
.star.on{color:#f0b429}
.chip{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;font-size:12px;font-weight:600}
.s-強{background:var(--down);color:#fff}
.s-中{background:var(--warn-soft);color:var(--warn)}
.s-微{background:var(--down-soft);color:var(--down)}
.s-無{background:var(--paper);color:var(--muted)}
.trend{display:inline-block;min-width:32px;text-align:center;border-radius:99px;padding:1px 10px;font-family:var(--font-num);font-weight:600}
.trend.lo{background:var(--down-soft);color:var(--down)}
.trend.hi{background:var(--up-soft);color:var(--up)}
.st{font-size:12px;border-radius:5px;padding:3px 8px;white-space:nowrap}
.st.up{background:var(--up-soft)} .st.down{background:var(--down-soft)}
.alert{font-size:11px;border-radius:5px;padding:2px 7px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}

/* ---------- 個股頁 ---------- */
.back{background:none;border:0;color:var(--accent);padding:0;margin-bottom:10px;font-size:13px}
.stock-head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-bottom:16px}
.stock-head h1{margin:0;font-family:var(--font-num);font-size:30px;line-height:1}
.stock-head .name{color:var(--muted)}
.price{font-family:var(--font-num);font-size:30px;font-weight:600;line-height:1}
.chg{font-family:var(--font-num);font-size:15px;font-weight:500}
.follow{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500}
.follow.on{background:var(--accent);color:#fff}
.summary{background:var(--accent-soft);border:0;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.summary .ai{background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.chart-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
svg.chart{width:100%;height:240px;display:block}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:8px}
.stats div span{display:block;font-size:12px;color:var(--muted)}
.stats div b{font-family:var(--font-num);font-size:16px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-of-type{border-bottom:0}
.news{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.news li{font-size:13px}
.news .sub{display:block}
.related{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.rel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;min-width:130px}
.rel:hover{border-color:var(--accent)}
.rel b{font-family:var(--font-num);display:block}
.nextstep{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-left:4px solid var(--accent)}
.nextstep .btn{margin-left:auto;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px}

/* ---------- 彈出視窗（看完整版） ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,28,.5);display:none;place-items:center;padding:16px;z-index:20}
.modal-bg.show{display:grid}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;padding:22px;max-height:85vh;overflow:auto}
.modal h3{margin:0 0 8px}
.modal .close{float:right;background:none;border:0;font-size:20px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}

/* ---------- 手機版 ---------- */
@media (max-width:1100px){.agents{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:10;justify-content:space-around}
  .brand,.side h6,.side-foot{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:11px;padding:6px;width:auto}
  .nav-btn .badge{display:none}
  main{padding:16px 16px 90px}
  .agents,.grid2,.grid3{grid-template-columns:1fr}
  .disclaimer{margin-left:0}
  .follow{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <!-- 左側選單 -->
  <nav class="side" aria-label="主選單">
    <div class="brand"><div class="brand-mark">US</div><div>美股研究室<small>Prototype v1</small></div></div>
    <h6>研究</h6>
    <button class="nav-btn on" id="nav-overview" data-go="overview">▦ <span>總覽</span></button>
    <button class="nav-btn" id="nav-watch" data-go="watch">★ <span>我的自選股</span><span class="badge" id="watch-badge">0</span></button>
    <button class="nav-btn" id="nav-stock" data-go="stock">◔ <span>個股研究</span></button>
    <div class="side-foot">示意資料・非投資建議<br>清大管顧社 金融組</div>
  </nav>

  <main id="view"></main>
</div>

<!-- 看完整版的彈出視窗 -->
<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <button class="close" id="modal-close" aria-label="關閉">×</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 假資料（之後要換成真資料，就是換掉這一段）
   ========================================================= */
const STOCKS = [
  // 代號, 名稱, 產業, 收盤價, 漲跌%, 成交量(百萬股), 量比, 空單比例%, 趨勢分數(1-5), 動能(日/週/月), 短期趨勢, 異常提示, 本益比, 市值(十億美元)

  {sym:"AMD",  name:"Advanced Micro Devices", sector:"半導體", price:238.10, chg:-3.12, vol:58.3, vr:2.1, si:2.40, trend:2, ps:["中","微","無"], st:"down", alert:"量增",   pe:118.4,cap:386},

  {sym:"AVGO", name:"Broadcom Inc",       sector:"半導體",   price:342.75, chg:0.86,  vol:22.1, vr:1.1, si:1.05, trend:4, ps:["中","強","中"], st:"up",   alert:"",      pe:84.6, cap:1610},
  {sym:"AAPL", name:"Apple Inc",          sector:"消費電子", price:267.44, chg:0.42,  vol:45.6, vr:0.9, si:1.00, trend:5, ps:["強","微","無"], st:"up",   alert:"",      pe:35.8, cap:3970},
  {sym:"MSFT", name:"Microsoft Corp",     sector:"軟體",     price:507.30, chg:-0.58, vol:19.7, vr:1.0, si:0.71, trend:3, ps:["微","微","中"], st:"up",   alert:"",      pe:36.2, cap:3770},
  {sym:"PLTR", name:"Palantir Technologies", sector:"軟體",  price:171.05, chg:-4.66, vol:96.2, vr:2.8, si:2.15, trend:1, ps:["強","中","微"], st:"down", alert:"急跌",   pe:390.5,cap:405},
  {sym:"GOOGL",name:"Alphabet Inc",       sector:"網路服務", price:284.90, chg:1.37,  vol:31.4, vr:1.3, si:0.88, trend:5, ps:["強","強","中"], st:"up",   alert:"創高",   pe:27.9, cap:3440},
  {sym:"META", name:"Meta Platforms",     sector:"網路服務", price:602.15, chg:-0.94, vol:16.9, vr:1.1, si:1.14, trend:2, ps:["微","無","無"], st:"down", alert:"",      pe:26.4, cap:1520},
  {sym:"AMZN", name:"Amazon.com Inc",     sector:"網路零售", price:232.60, chg:-0.96, vol:41.2, vr:1.4, si:0.96, trend:4, ps:["強","強","微"], st:"down", alert:"",      pe:33.1, cap:2480},
  {sym:"TSLA", name:"Tesla Inc",          sector:"汽車",     price:401.80, chg:-2.34, vol:88.5, vr:1.7, si:2.34, trend:4, ps:["中","中","中"], st:"down", alert:"量增",   pe:265.0,cap:1330},
  {sym:"JPM",  name:"JPMorgan Chase",     sector:"金融",     price:309.25, chg:0.31,  vol:8.6,  vr:0.8, si:0.74, trend:3, ps:["無","微","中"], st:"up",   alert:"",      pe:15.4, cap:845},
  {sym:"V",    name:"Visa Inc",           sector:"金融",     price:331.70, chg:0.18,  vol:6.1,  vr:0.7, si:1.32, trend:3, ps:["無","無","微"], st:"up",   alert:"",      pe:31.6, cap:640},
  {sym:"LLY",  name:"Eli Lilly",          sector:"醫療保健", price:1012.40,chg:2.05,  vol:4.9,  vr:1.5, si:0.69, trend:5, ps:["強","強","強"], st:"up",   alert:"創高",   pe:49.7, cap:958},
  {sym:"UNH",  name:"UnitedHealth Group", sector:"醫療保健", price:327.85, chg:-1.21, vol:9.3,  vr:1.2, si:1.48, trend:2, ps:["微","無","無"], st:"down", alert:"",      pe:17.0, cap:297},
];

const NEWS = {
  default:[
    {t:"法人看好 AI 資本支出延續到明年，供應鏈訂單能見度拉長", src:"示意新聞", time:"3 小時前"},
    {t:"FOMC 會議紀要將公布，市場關注降息步調", src:"示意新聞", time:"6 小時前"},
    {t:"盤後交易量放大，短線資金在大型科技股之間輪動", src:"示意新聞", time:"昨天"},
  ],
  NVDA:[
    {t:"輝達本週公布財報，市場預期資料中心營收再創新高", src:"示意新聞", time:"2 小時前"},
    {t:"分析師：新一代 GPU 出貨節奏是本季最大變數", src:"示意新聞", time:"5 小時前"},
    {t:"半導體類股財報前普遍觀望，成交量放大", src:"示意新聞", time:"昨天"},
  ],
};

const WATCH_DEFAULT = ["NVDA","AMZN","TSLA","AAPL","GOOGL"];

/* =========================================================
   2. 小工具
   ========================================================= */
const $ = id => document.getElementById(id);
const fmt = (n, d=2) => n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const sign = n => (n > 0 ? "+" : "") + fmt(n);
const cls = n => n >= 0 ? "up" : "down";
const findStock = sym => STOCKS.find(s => s.sym === sym);

// 自選股清單：存在瀏覽器裡（只有自己看得到，換電腦就沒了；正式版要放資料庫）
let watch = (() => { try { return JSON.parse(localStorage.getItem("watch")) || WATCH_DEFAULT.slice(); } catch(e){ return WATCH_DEFAULT.slice(); } })();
function saveWatch(){ try { localStorage.setItem("watch", JSON.stringify(watch)); } catch(e){} $("watch-badge").textContent = watch.length; }

// 互動紀錄：之後算 View-to-Page 用。現在只印在瀏覽器的 Console（按 F12 可看）
function track(event, detail){ console.log("[track]", event, detail || ""); }

function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }

// 用代號產生「固定的」隨機走勢，讓每次打開圖形都一樣
function seeded(sym){ let h = 0; for (const c of sym) h = (h * 31 + c.charCodeAt(0)) >>> 0; return () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; }; }
function series(s, days){
  const r = seeded(s.sym + days), pts = [s.price];
  const drift = (s.st === "up" ? -1 : 1) * 0.0012;
  for (let i = 1; i < days; i++) pts.unshift(pts[0] * (1 + drift + (r() - 0.5) * 0.035));
  return pts;
}

function sparkline(s){
  const p = series(s, 30), min = Math.min(...p), max = Math.max(...p);
  const d = p.map((v, i) => `${(i / 29 * 76 + 2).toFixed(1)},${(22 - (v - min) / (max - min || 1) * 18).toFixed(1)}`).join(" ");
  const c = s.chg >= 0 ? "var(--up)" : "var(--down)";
  return `<svg width="80" height="26" viewBox="0 0 80 26" aria-hidden="true"><polyline points="${d}" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`;
}

function renderRows(){
  let list = STOCKS.slice();
  if (state.tab === "watch") list = list.filter(s => watch.includes(s.sym));
  if (state.sector) list = list.filter(s => s.sector === state.sector);
  if (state.q){ const q = state.q.toLowerCase(); list = list.filter(s => s.sym.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)); }
  if (state.sort) list.sort((a, b) => b[state.sort] - a[state.sort]);

  $("count").textContent = `符合 ${list.length} / ${STOCKS.length} 檔`;
  $("rows").innerHTML = list.length ? list.map(s => `
    <tr data-stock="${s.sym}" tabindex="0">
      <td><button class="star ${watch.includes(s.sym) ? "on" : ""}" data-star="${s.sym}" aria-label="加入或移除自選">★</button></td>
      <td class="sym"><b>${s.sym}</b><span>${s.name}</span></td>

      <td class="r num ${cls(s.chg)}">${fmt(s.price)}</td>
      <td class="r num ${cls(s.chg)}">${sign(s.chg)}%</td>
      <td class="r num">${fmt(s.vol,1)}</td>
      <td class="r num">${s.vr.toFixed(1)}×</td>
      <td class="r num">${s.si.toFixed(2)}%</td>
      <td><span class="trend ${s.trend >= 3 ? "hi" : "lo"}">${s.trend}</span></td>
      ${s.ps.map(v => `<td><span class="chip s-${v}">${v}</span></td>`).join("")}
      <td><span class="st ${s.st}">${s.st === "up" ? "▲ 處於上漲" : "▼ 處於下跌"}</span></td>
      <td>${sparkline(s)}</td>

function chartSVG(s, days){
  const p = series(s, days), W = 640, H = 240, pad = 34;
  const min = Math.min(...p), max = Math.max(...p);
  const x = i => pad + i / (p.length - 1) * (W - pad - 10);
  const y = v => 14 + (1 - (v - min) / (max - min || 1)) * (H - 44);
  const line = p.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const c = p[p.length - 1] >= p[0] ? "var(--up)" : "var(--down)";
  const ticks = [min, (min + max) / 2, max];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${s.sym} 近 ${days} 天收盤價走勢（示意）">
    ${ticks.map(t => `<line x1="${pad}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pad - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans">${t.toFixed(0)}</text>`).join("")}
    <polygon points="${x(0)},${H - 30} ${line} ${x(p.length - 1)},${H - 30}" fill="${c}" opacity=".10"/>
    <polyline points="${line}" fill="none" stroke="${c}" stroke-width="2"/>
    <circle cx="${x(p.length - 1)}" cy="${y(p[p.length - 1])}" r="4" fill="${c}"/>
    <text x="${pad}" y="${H - 10}" font-size="11" fill="var(--muted)">${days} 天前</text>
    <text x="${W - 10}" y="${H - 10}" font-size="11" fill="var(--muted)" text-anchor="end">今天</text>
  </svg>`;
}

/* =========================================================
   6. 切換頁面 ＆ 點擊處理
   ========================================================= */
let page = "overview";

function go(to, sym){
  if (sym) currentSym = sym;
  if (to === "watch"){ page = "overview"; state.tab = "watch"; state.sector = null; }
  else if (to === "overview"){ page = "overview"; if (state.tab === "watch" && to === "overview" && !sym) state.tab = "all"; }
  else page = to;
  track("page_view", page === "stock" ? currentSym : state.tab);
  render();
  try { history.replaceState(null, "", "#" + (page === "stock" ? currentSym.toLowerCase() : "overview")); } catch(e){}
  window.scrollTo(0, 0);
}

function render(){
  $("view").innerHTML = page === "stock" ? stockHTML(currentSym) : overviewHTML();
  if (page === "overview"){
    renderRows();
    $("q").addEventListener("input", e => { state.q = e.target.value; renderRows(); });
  }
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("on"));
  $(page === "stock" ? "nav-stock" : state.tab === "watch" ? "nav-watch" : "nav-overview").classList.add("on");
}

function toggleWatch(sym){
  if (watch.includes(sym)){ watch = watch.filter(x => x !== sym); toast(`已把 ${sym} 移出自選`); }
  else { watch.push(sym); toast(`已把 ${sym} 加入自選`); }
  track("toggle_watch", sym); saveWatch(); render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-star],[data-stock],[data-go],[data-sector],[data-tab],[data-sort],[data-range],[data-modal]");
  if (!t) return;
  const d = t.dataset;
  if (d.star){
    e.stopPropagation();
    if (t.classList.contains("btn") && watch.includes(d.star)) return go("watch");
    return toggleWatch(d.star);
  }
  if (d.modal){
    const [title, body] = modalContent(d.modal);
    $("modal-title").textContent = title; $("modal-body").innerHTML = body;
    $("modal").classList.add("show"); $("modal-close").focus();
    return track("click_more", d.modal);
  }
  if (d.stock) return go("stock", d.stock);
  if (d.go) return go(d.go);
  if (d.sector){ state.sector = state.sector === d.sector ? null : d.sector; track("filter_sector", d.sector); render(); return; }
  if (d.tab){ state.tab = d.tab; render(); return; }
  if (d.sort){ state.sort = state.sort === d.sort ? null : d.sort; renderRows(); return; }
  if (d.range){ range = +d.range; render(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") $("modal").classList.remove("show");
  if (e.key === "Enter" && e.target.matches("tr[data-stock]")) go("stock", e.target.dataset.stock);
});
$("modal-close").addEventListener("click", () => $("modal").classList.remove("show"));
$("modal").addEventListener("click", e => { if (e.target.id === "modal") $("modal").classList.remove("show"); });

// 開啟時：網址如果是 #nvda 這種，就直接打開那檔個股

  saveWatch();
  const h = (location.hash || "").slice(1).toUpperCase();
  if (h && findStock(h)){ currentSym = h; page = "stock"; }
  render();
})();
