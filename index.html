<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美股研究室 Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   美股研究室 Prototype v2（依假說矩陣改版）
   版面概念：首頁＝我的自選股（主）＋市場熱點（側）；個股頁＝三層資訊
     第 1 層：中文重點摘要（每點附出處、可展開原文）
     第 2 層：分頁（走勢／財報／新聞／評級與目標價／同業比較）
     第 3 層：看原文、看完整版、自訂指標
   ---------------------------------------------------------
   給組員：這個檔案分三段
   1. <style>   外觀（顏色、字型、排版）
   2. <body>    頁面骨架
   3. <script>  假資料 ＋ 互動
   右上角「顯示假說標註」可以在畫面上標出每個功能對應哪個假說，報告時用
   ========================================================= */
:root{
  --ink:#16202e; --muted:#5f6b7c; --line:#e3e7ee; --paper:#f4f6fa; --card:#ffffff; --nav:#101b33;
  --accent:#1f5fd6; --accent-soft:#e8effc;
  --up:#14895a; --up-soft:#e3f4ec; --down:#d23a3a; --down-soft:#fbe7e7;
  --warn:#b7700b; --warn-soft:#fdf1dc; --hyp:#7a4fd6; --hyp-soft:#efe8fc;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-num:"IBM Plex Sans","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e7ecf4;--muted:#9aa6b8;--line:#263247;--paper:#0d1424;--card:#141e31;--nav:#0a1020;
    --accent:#6b9cff;--accent-soft:#1b2a4a;--up:#3ccb8b;--up-soft:#123326;--down:#ff6b6b;--down-soft:#3a1a1d;
    --warn:#f0b04a;--warn-soft:#3a2a10;--hyp:#b39bff;--hyp-soft:#2a2145;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e7ecf4;--muted:#9aa6b8;--line:#263247;--paper:#0d1424;--card:#141e31;--nav:#0a1020;
  --accent:#6b9cff;--accent-soft:#1b2a4a;--up:#3ccb8b;--up-soft:#123326;--down:#ff6b6b;--down-soft:#3a1a1d;
  --warn:#f0b04a;--warn-soft:#3a2a10;--hyp:#b39bff;--hyp-soft:#2a2145;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
.sub{color:var(--muted);font-size:12px}

/* ---------- 假說標註（預設隱藏） ---------- */
.hyp{display:none;font-size:11px;font-weight:600;color:var(--hyp);background:var(--hyp-soft);border-radius:5px;padding:1px 7px;margin-left:6px;vertical-align:middle;white-space:nowrap}
body.show-hyp .hyp{display:inline-block}
body.show-hyp .hyp-box{outline:2px dashed var(--hyp);outline-offset:3px}

/* ---------- 整體版面 ---------- */
.app{display:grid;grid-template-columns:200px 1fr;min-height:100%}
.side{background:var(--nav);color:#c9d3e6;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:#fff}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-family:var(--font-num)}
.brand small{display:block;color:#8d9ab3;font-size:11px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;color:#c9d3e6}
.nav-btn:hover{background:#1b2846}
.nav-btn.on{background:#22335a;color:#fff}
.nav-btn .badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.side-foot{margin-top:auto;font-size:11px;color:#7d8aa5;padding:8px}

main{padding:22px 28px 60px;min-width:0;max-width:1280px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.topbar h1{font-size:22px;margin:0;text-wrap:balance}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.hyp-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tagline{color:var(--muted);margin:0 0 18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h3{margin:0;font-size:15px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-head .right{margin-left:auto}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:500;font-size:13px}
.link:hover{text-decoration:underline}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag{font-size:11px;border-radius:5px;padding:1px 7px;white-space:nowrap}
.tag.hi{background:var(--down-soft);color:var(--down)}
.tag.mid{background:var(--warn-soft);color:var(--warn)}
.tag.lo{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--up-soft);color:var(--up)}

/* ---------- 首頁 ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.watch-list{display:grid;gap:10px}
.wcard{display:grid;grid-template-columns:120px 110px 90px minmax(0,1fr);gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.wcard:hover{border-color:var(--accent)}
.wcard .sym b{display:block;font-family:var(--font-num);font-size:16px}
.wcard .sym span{font-size:12px;color:var(--muted)}
.wcard .px b{display:block;font-family:var(--font-num);font-size:16px}
.wcard .px span{font-family:var(--font-num);font-size:13px}
.wcard .say{font-size:13px}
.wcard .say .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.src{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-left:4px;white-space:nowrap}
.add-row{display:flex;gap:8px;align-items:center;position:relative;margin-bottom:12px}
.add-row input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px;flex:1;min-width:0}
.suggest{position:absolute;top:42px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:5;display:none;max-height:260px;overflow:auto}
.suggest.show{display:block}
.suggest button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px}
.suggest button:hover{background:var(--paper)}
.side-col{display:grid;gap:14px}
.hot{display:grid;gap:8px}
.hot-item{display:flex;justify-content:space-between;align-items:center;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;text-align:left}
.hot-item:hover{border-color:var(--accent)}
.sectors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sector{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:12px}
.sector b{display:block;font-size:13px}
.events{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.events li{display:flex;gap:8px;align-items:center}
.alerts{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13px}
.alerts li{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:6px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

/* ---------- 個股頁 ---------- */
.back{background:none;border:0;color:var(--accent);padding:0;margin-bottom:10px;font-size:13px}
.stock-head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;margin-bottom:14px}
.stock-head h1{margin:0;font-family:var(--font-num);font-size:30px;line-height:1}
.price{font-family:var(--font-num);font-size:30px;font-weight:600;line-height:1}
.chg{font-family:var(--font-num);font-size:15px;font-weight:500}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.layer-label{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.layer-label::after{content:"";flex:1;height:1px;background:var(--line)}
.summary{border-left:4px solid var(--accent)}
.points{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.points li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.points .n{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700}
.orig{display:none;margin-top:6px;background:var(--paper);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);font-family:var(--font-num)}
.orig.show{display:block}
.term{background:none;border:0;padding:0;border-bottom:1px dashed var(--accent);color:inherit;font:inherit;cursor:help}
.note-box{margin-top:12px;background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:13px}
.tabs{display:flex;gap:4px;background:var(--paper);border-radius:9px;padding:3px;flex-wrap:wrap}
.tabs button{border:0;background:none;border-radius:7px;padding:6px 12px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab-body{margin-top:14px}
svg.chart{width:100%;height:240px;display:block}
.ind{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ind label{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}
.ind input{accent-color:var(--accent)}
.kv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kv-grid div span{display:block;font-size:12px;color:var(--muted)}
.kv-grid div b{font-family:var(--font-num);font-size:16px}
.news{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.rating-bar{position:relative;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--down-soft),var(--paper),var(--up-soft));margin:26px 0 30px}
.rating-bar .mk{position:absolute;top:-6px;width:2px;height:20px;background:var(--muted)}
.rating-bar .mk span{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted)}
.rating-bar .mk.now{background:var(--ink)}
.rating-bar .mk.now span{top:-20px;color:var(--ink);font-weight:600}
.views{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.view{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
tr.me td{background:var(--accent-soft)}
tbody tr.go{cursor:pointer}
tbody tr.go:hover td{background:var(--paper)}
.table-wrap{overflow-x:auto}
.trend{display:inline-block;min-width:30px;text-align:center;border-radius:99px;padding:0 9px;font-family:var(--font-num);font-weight:600}
.trend.lo{background:var(--down-soft);color:var(--down)} .trend.hi{background:var(--up-soft);color:var(--up)}

/* ---------- 彈窗 ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,28,.5);display:none;place-items:center;padding:16px;z-index:20}
.modal-bg.show{display:grid}
.modal{background:var(--card);border-radius:14px;max-width:460px;width:100%;padding:22px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .close{float:right;background:none;border:0;font-size:20px;color:var(--muted)}
.field{display:grid;gap:6px;margin-top:14px}
.field label{font-size:13px;font-weight:500}
.field input[type=number],.field input[type=text]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px}
.seg{display:flex;gap:6px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.pop{position:absolute;z-index:25;max-width:260px;background:var(--ink);color:var(--card);font-size:12px;border-radius:8px;padding:8px 10px;display:none;line-height:1.5}
.pop.show{display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}

@media (max-width:1050px){.home{grid-template-columns:1fr}.kv-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px;z-index:10;justify-content:space-around}
  .brand,.side-foot{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:11px;padding:6px;width:auto}
  .nav-btn .badge{display:none}
  main{padding:16px 16px 90px}
  .wcard{grid-template-columns:1fr 1fr;gap:8px}
  .wcard .say{grid-column:1 / -1}
  .wcard svg{display:none}
  .views{grid-template-columns:1fr}
  .actions{margin-left:0}
  .hyp-toggle{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="主選單">
    <div class="brand"><div class="brand-mark">US</div><div>美股研究室<small>Prototype v2</small></div></div>
    <button class="nav-btn on" id="nav-home" data-go="home">★ <span>我的首頁</span></button>
    <button class="nav-btn" id="nav-market" data-go="market">▦ <span>市場總覽</span></button>
    <button class="nav-btn" id="nav-stock" data-go="stock">◔ <span>個股研究</span></button>
    <button class="nav-btn" id="nav-alerts" data-go="home" data-scroll="alerts-card">🔔 <span>我的提醒</span><span class="badge" id="alert-badge">0</span></button>
    <div class="side-foot">示意資料・非投資建議<br>清大管顧社 金融組</div>
  </nav>
  <main id="view"></main>
</div>

<div class="modal-bg" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal"><button class="close" id="modal-close" aria-label="關閉">×</button><div id="modal-inner"></div></div>
</div>
<div class="pop" id="pop" role="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. 假資料（之後換成真資料，就是換掉這一段）
   ========================================================= */
const STOCKS = [

  {sym:"AAPL", name:"Apple",           zh:"蘋果",     sector:"消費電子", price:267.44, chg:0.42, vol:45.6, vr:0.9, si:1.00, trend:5, st:"up", alert:"", pe:35.8, cap:3970, earn:"1 月底"},

  {sym:"AMZN", name:"Amazon",          zh:"亞馬遜",   sector:"網路零售", price:232.60, chg:-0.96, vol:41.2, vr:1.4, si:0.96, trend:4, st:"down", alert:"", pe:33.1, cap:2480, earn:"2 月初"},

  {sym:"JPM",  name:"JPMorgan Chase",  zh:"摩根大通", sector:"金融",     price:309.25, chg:0.31, vol:8.6, vr:0.8, si:0.74, trend:3, st:"up", alert:"", pe:15.4, cap:845, earn:"1 月中"},
  {sym:"V",    name:"Visa",            zh:"Visa",     sector:"金融",     price:331.70, chg:0.18, vol:6.1, vr:0.7, si:1.32, trend:3, st:"up", alert:"", pe:31.6, cap:640, earn:"1 月底"},
  {sym:"LLY",  name:"Eli Lilly",       zh:"禮來",     sector:"醫療保健", price:1012.40, chg:2.05, vol:4.9, vr:1.5, si:0.69, trend:5, st:"up", alert:"創高", pe:49.7, cap:958, earn:"2 月初"},
  {sym:"UNH",  name:"UnitedHealth",    zh:"聯合健康", sector:"醫療保健", price:327.85, chg:-1.21, vol:9.3, vr:1.2, si:1.48, trend:2, st:"down", alert:"", pe:17.0, cap:297, earn:"1 月中"},
];

// H1：中文重點摘要。每一點都有出處 src，有原文的可以展開 orig
const SUMMARIES = {
  NVDA:[

function seeded(seed){ let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0; return () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; }; }
function series(s, days){
  const r = seeded(s.sym + "v2"), pts = [s.price], drift = (s.st === "up" ? -1 : 1) * 0.0012;
  for (let i = 1; i < days; i++) pts.unshift(pts[0] * (1 + drift + (r() - 0.5) * 0.035));
  return pts;
}
const summaryOf = s => SUMMARIES[s.sym] || autoSummary(s);
const stripTags = h => h.replace(/<[^>]+>/g, "");
function alertText(a){
  if (a.kind === "price") return `${a.dir === "above" ? "漲到" : "跌破"} $${fmt(a.price)}`;
  return `重大事件：${a.what.join("、")}`;
}

}

let currentSym = "NVDA", tab = "chart", range = 90, openOrig = {};

function chartSVG(s){
  const all = series(s, range + 60), p = all.slice(60), W = 680, H = 240, pad = 38;
  const ma = n => all.map((_, i) => i < n - 1 ? null : all.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n).slice(60);
  const lines = [p]; if (inds.ma20) lines.push(ma(20)); if (inds.ma60) lines.push(ma(60));
  const vals = lines.flat().filter(v => v != null), min = Math.min(...vals), max = Math.max(...vals);
  const x = i => pad + i / (p.length - 1) * (W - pad - 10), y = v => 12 + (1 - (v - min) / (max - min || 1)) * (H - 40);
  const path = arr => arr.map((v, i) => v == null ? "" : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(" ");
  const c = p[p.length - 1] >= p[0] ? "var(--up)" : "var(--down)";
  const ticks = [min, (min + max) / 2, max];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${s.sym} 近 ${range} 天走勢（示意）">
    ${ticks.map(t => `<line x1="${pad}" x2="${W - 10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pad - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t.toFixed(0)}</text>`).join("")}
    <polygon points="${x(0)},${H - 28} ${path(p)} ${x(p.length - 1)},${H - 28}" fill="${c}" opacity=".09"/>
    <polyline points="${path(p)}" fill="none" stroke="${c}" stroke-width="2"/>
    ${inds.ma20 ? `<polyline points="${path(ma(20))}" fill="none" stroke="var(--warn)" stroke-width="1.4"/>` : ""}
    ${inds.ma60 ? `<polyline points="${path(ma(60))}" fill="none" stroke="var(--hyp)" stroke-width="1.4"/>` : ""}
    <circle cx="${x(p.length - 1)}" cy="${y(p[p.length - 1])}" r="4" fill="${c}"/>
    <text x="${pad}" y="${H - 8}" font-size="11" fill="var(--muted)">${range} 天前</text>
    <text x="${W - 10}" y="${H - 8}" font-size="11" fill="var(--muted)" text-anchor="end">今天</text>
  </svg>`;
}
function rsi(s){
  const p = series(s, 30); let g = 0, l = 0;
  for (let i = 16; i < 30; i++){ const d = p[i] - p[i - 1]; d > 0 ? g += d : l -= d; }
  return 100 - 100 / (1 + g / (l || 1));
}

    <div class="card-head" style="margin-top:6px"><b>專業看法</b><span class="hyp">次要：專業看法</span></div>
    <div class="views">
      <div class="view"><span class="tag ok">看多</span> ${s.zh}的核心業務仍在成長，回檔是長線布局機會。<div class="sub">某美系券商報告（示意）・<button class="link" data-more="view1">展開原文</button></div></div>
      <div class="view"><span class="tag mid">保守</span> 估值已反映不少樂觀預期，短期上檔空間有限。<div class="sub">某獨立研究機構（示意）・<button class="link" data-more="view2">展開原文</button></div></div>
    </div>
    <p class="sub" style="margin-top:10px">以上為示意資料，非投資建議。</p>`;
  }
  if (tab === "peers"){
    const peers = STOCKS.filter(x => x.sector === s.sector);
    const list = (peers.length > 1 ? peers : [s, ...STOCKS.filter(x => x.sym !== s.sym && x.trend >= 4).slice(0, 3)]);
    return `
    <div class="card-head"><b>同業比較・${s.sector}</b><span class="hyp">次要：同業比較</span></div>
    <div class="table-wrap"><table>
      <thead><tr><th>股票</th><th class="r">收盤價</th><th class="r">漲跌幅</th><th class="r"><button class="term" data-term="本益比">本益比</button></th><th class="r">市值(B)</th><th>趨勢</th></tr></thead>
      <tbody>${list.map(x => `<tr class="${x.sym === s.sym ? "me" : "go"}" ${x.sym === s.sym ? "" : `data-stock="${x.sym}"`}><td><b class="num">${x.sym}</b> <span class="sub">${x.zh}</span></td><td class="r num">${fmt(x.price)}</td><td class="r num ${cls(x.chg)}">${sign(x.chg)}%</td><td class="r num">${x.pe.toFixed(1)}</td><td class="r num">${fmt(x.cap, 0)}</td><td><span class="trend ${x.trend >= 3 ? "hi" : "lo"}">${x.trend}</span></td></tr>`).join("")}</tbody>
    </table></div>`;
  }
}

function stockHTML(sym){
  const s = findStock(sym), on = watch.includes(sym), pts = summaryOf(s), note = notes[sym];
  const nAlerts = alerts.filter(a => a.sym === sym).length;
  return `
  <button class="back" data-go="home">← 回我的首頁</button>
  <div class="stock-head">
    <div><h1>${s.sym}</h1><div class="sub" style="font-size:13px">${s.zh}・${s.name}・${s.sector}</div></div>
    <div><div class="price ${cls(s.chg)}">${fmt(s.price)}</div><div class="chg ${cls(s.chg)}">${sign(s.price * s.chg / 100)}（${sign(s.chg)}%）</div></div>
    ${s.alert ? `<span class="tag mid">${s.alert}</span>` : ""}
    <div class="actions">
      <button class="btn ${on ? "on" : ""}" data-star="${s.sym}">${on ? "★ 已在自選" : "☆ 加入自選"}</button>
      <button class="btn ${nAlerts ? "on" : ""}" data-alert="${s.sym}">🔔 ${nAlerts ? `提醒（${nAlerts}）` : "提醒我"}</button>
      <button class="btn" data-plan="${s.sym}">📝 下單前檢查</button>
    </div>
  </div>

  <div class="layer-label">第 1 層・30 秒看懂<span class="hyp">E1 資訊分層</span></div>
  <section class="card summary hyp-box">
    <div class="card-head"><h3>中文重點摘要</h3><span class="hyp">H1 中文摘要＋白話解釋（8/9）</span><span class="sub right">虛線的詞可以點，看白話解釋</span></div>
    <ul class="points">
      ${pts.map((p, i) => `<li><span class="n">${i + 1}</span><div>${p.t}<span class="src">${p.src}</span>
        ${p.orig ? ` <button class="link" data-orig="${i}">${openOrig[i] ? "收起原文" : "展開原文"}</button><div class="orig ${openOrig[i] ? "show" : ""}">${p.orig}</div>` : ""}</div></li>`).join("")}
    </ul>
    ${note ? `<div class="note-box hyp-box">📝 你的下單前紀錄：${note.why || "（未填理由）"}${note.target ? `・目標 $${note.target}` : ""}${note.stop ? `・停損 $${note.stop}` : ""} <button class="link" data-plan="${s.sym}">修改</button><span class="hyp">H3b 輕量引導（次要）</span></div>` : ""}
  </section>

  <div class="layer-label">第 2 層・想多看一點再點開</div>
  <section class="card">
    <div class="tabs">
      ${[["chart","走勢"],["fin","財報與數據"],["news","新聞"],["rating","評級與目標價"],["peers","同業比較"]].map(([k, l]) => `<button class="${tab === k ? "on" : ""}" data-tab="${k}">${l}</button>`).join("")}
    </div>
    <div class="tab-body">${tabHTML(s)}</div>
  </section>
  <p class="sub" style="margin-top:12px">第 3 層：每個區塊的「展開原文」「看完整版」。本頁所有數字皆為示意資料，非投資建議。</p>`;
}

/* =========================================================
   6. 彈窗：提醒（H4）、下單前檢查（H3b）、原文
   ========================================================= */
function openModal(html){ $("modal-inner").innerHTML = html; $("modal").classList.add("show"); $("modal-close").focus(); }
function closeModal(){ $("modal").classList.remove("show"); }

function alertModal(sym){
  const s = findStock(sym);
  openModal(`
    <h3>🔔 ${sym} 提醒我</h3><div class="sub">兩步驟設定，不用懂技術指標<span class="hyp">H4 極簡提醒（6/9）</span></div>
    <div class="field"><label>① 到價提醒</label>
      <div class="seg"><button class="btn on" data-dir="below" id="dir-below">跌破</button><button class="btn" data-dir="above" id="dir-above">漲到</button>
      <input type="number" id="a-price" value="${(s.price * 0.95).toFixed(0)}" step="1" aria-label="價格" style="flex:1"></div>
      <span class="sub">現價 $${fmt(s.price)}；預設填入現價的 95%</span>
    </div>
    <div class="field"><label>② 重大事件推播</label>
      <label class="chk"><input type="checkbox" id="e1" checked> 財報公布（${s.earn}）</label>
      <label class="chk"><input type="checkbox" id="e2" checked> 單日漲跌超過 5%</label>
      <label class="chk"><input type="checkbox" id="e3"> 重大新聞（併購、高層異動）</label>
    </div>
    <div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" data-save-alert="${sym}">完成</button></div>`);
}
function planModal(sym){
  const s = findStock(sym), n = notes[sym] || {};
  openModal(`
    <h3>📝 ${sym} 下單前檢查</h3><div class="sub">花 30 秒想清楚，之後回來看得到<span class="hyp">H3b 輕量引導（次要）</span></div>
    <div class="field"><label>先確認</label>
      <label class="chk"><input type="checkbox" checked disabled> 下次財報：${s.earn}${s.alert === "財報前" ? "（財報前波動可能較大）" : ""}</label>
      <label class="chk"><input type="checkbox" checked disabled> 現價距分析師平均目標價：${sign(((s.trend >= 3 ? 1.18 : 1.08) - 1) * 100)}%</label>
    </div>
    <div class="field"><label for="p-why">我為什麼想買／賣？（一句話就好）</label><input type="text" id="p-why" value="${n.why || ""}" placeholder="例如：財報後回檔，想分批買"></div>
    <div class="seg" style="margin-top:12px">
      <div class="field" style="margin:0;flex:1"><label for="p-target">目標價（選填）</label><input type="number" id="p-target" value="${n.target || ""}"></div>
      <div class="field" style="margin:0;flex:1"><label for="p-stop">停損價（選填）</label><input type="number" id="p-stop" value="${n.stop || ""}"></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" data-save-plan="${sym}">記下來</button></div>`);
}

/* =========================================================
   7. 切換頁面 ＆ 點擊處理
   ========================================================= */
let page = "home";
function go(to, sym){
  if (sym){ if (sym !== currentSym){ openOrig = {}; tab = "chart"; } currentSym = sym; }
  page = to; track("page_view", page === "stock" ? currentSym : page); render(); window.scrollTo(0, 0);
  try { history.replaceState(null, "", "#" + (page === "stock" ? currentSym.toLowerCase() : page)); } catch(e){}
}
function render(){
  $("view").innerHTML = page === "stock" ? stockHTML(currentSym) : page === "market" ? marketHTML() : homeHTML();
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("on"));
  $("nav-" + page).classList.add("on");
  if (page === "home"){
    $("hyp-switch").addEventListener("change", e => { document.body.classList.toggle("show-hyp", e.target.checked); });
    const q = $("add-q"), sg = $("suggest");
    q.addEventListener("input", () => {
      const v = q.value.trim().toLowerCase();
      const hits = v ? STOCKS.filter(s => !watch.includes(s.sym) && (s.sym.toLowerCase().includes(v) || s.zh.toLowerCase().includes(v) || s.name.toLowerCase().includes(v))) : [];
      sg.innerHTML = hits.length ? hits.map(s => `<button data-addwatch="${s.sym}"><b class="num">${s.sym}</b><span>${s.zh}</span><span class="sub">${s.sector}</span></button>`).join("") : (v ? `<div class="empty" style="padding:10px 12px">找不到，或已經在自選裡了</div>` : "");
      sg.classList.toggle("show", !!v);
    });
  }
}
function toggleWatch(sym){
  if (watch.includes(sym)){ watch = watch.filter(x => x !== sym); toast(`已把 ${sym} 移出自選`); }
  else { watch.push(sym); toast(`已把 ${sym} 加入自選`); }
  track("toggle_watch", sym); persist(); render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-term],[data-orig],[data-star],[data-alert],[data-plan],[data-addwatch],[data-del-alert],[data-stock],[data-go],[data-tab],[data-range],[data-msector],[data-msort],[data-more],[data-dir],[data-save-alert],[data-save-plan],[data-close]");
  if (!t){ $("pop").classList.remove("show"); return; }
  const d = t.dataset;
  if (d.term){
    e.stopPropagation(); const p = $("pop"), r = t.getBoundingClientRect();
    p.innerHTML = `<b>${d.term}</b><br>${TERMS[d.term]}`; p.classList.add("show");
    p.style.left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 280) + "px";
    p.style.top = (r.bottom + window.scrollY + 6) + "px"; return track("click_term", d.term);
  }
  $("pop").classList.remove("show");
  if (d.orig !== undefined){ openOrig[d.orig] = !openOrig[d.orig]; track("expand_original", currentSym + "#" + d.orig); return render(); }
  if (d.star){ return toggleWatch(d.star); }
  if (d.addwatch){ e.stopPropagation(); return toggleWatch(d.addwatch); }
  if (d.alert){ return alertModal(d.alert); }
  if (d.plan){ return planModal(d.plan); }
  if (d.delAlert !== undefined){ alerts.splice(+d.delAlert, 1); persist(); toast("已刪除提醒"); return render(); }
  if (d.dir){ $("dir-below").classList.toggle("on", d.dir === "below"); $("dir-above").classList.toggle("on", d.dir === "above"); return; }
  if (d.saveAlert){
    const sym = d.saveAlert, price = parseFloat($("a-price").value), dir = $("dir-above").classList.contains("on") ? "above" : "below";
    const what = [["e1","財報公布"],["e2","單日漲跌超過 5%"],["e3","重大新聞"]].filter(([id]) => $(id).checked).map(([, l]) => l);
    alerts = alerts.filter(a => a.sym !== sym);
    if (!isNaN(price)) alerts.push({sym, kind:"price", dir, price});
    if (what.length) alerts.push({sym, kind:"event", what});
    persist(); closeModal(); toast(`已設定 ${sym} 的提醒`); track("set_alert", sym); return render();
  }
  if (d.savePlan){
    const sym = d.savePlan; notes[sym] = {why:$("p-why").value.trim(), target:$("p-target").value, stop:$("p-stop").value};
    persist(); closeModal(); toast("已記下，下次打開這檔就看得到"); track("save_plan", sym); return render();
  }
  if (d.close !== undefined) return closeModal();
  if (d.more){
    track("click_more", d.more);
    return openModal(`<h3>原文／完整版</h3><p>這裡之後放英文原文或完整內容，並標示來源連結與發布時間。</p><p class="sub">Prototype 階段先用這個視窗代表「第 3 層：點了看得到原始資料」。</p>`);
  }
  if (d.stock) return go("stock", d.stock);
  if (d.go){ go(d.go); if (t.dataset.scroll){ const el = $(t.dataset.scroll); if (el) el.scrollIntoView({behavior:"smooth"}); } return; }
  if (d.tab){ tab = d.tab; track("open_tab", d.tab); return render(); }
  if (d.range){ range = +d.range; return render(); }
  if (d.msector !== undefined){ mkt.sector = d.msector || null; return render(); }
  if (d.msort){ mkt.sort = d.msort; return render(); }
});
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.ind){ inds[e.target.dataset.ind] = e.target.checked; persist(); track("toggle_indicator", e.target.dataset.ind); render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeModal(); $("pop").classList.remove("show"); }
  if (e.key === "Enter" && e.target.matches("[data-stock][role=button]")) go("stock", e.target.dataset.stock);
});
$("modal-close").addEventListener("click", closeModal);
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

(function init(){
  persist();
  const h = (location.hash || "").slice(1);
  if (h === "market") page = "market";
  else if (h && findStock(h.toUpperCase())){ currentSym = h.toUpperCase(); page = "stock"; }
  render();
})();
</script>
</body>
</html>
